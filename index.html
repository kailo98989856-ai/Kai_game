<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">
        <div class="card">
            <h1>
                Are you happy because
                <span>Kai</span> exists,
                or is <span>Kai</span> happy
                because you exist?
            </h1>

            <div class="buttons">
                <button id="kaiButton">Kai is happy because I exist</button>
                <button id="meButton">I'm happy because Kai exists</button>
            </div>
        </div>
    </main>

    <section id="winScreen" class="win-screen">
        <div class="win-text">
            hahahahaa<br>
            <span>i win this game, lady</span>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
